mcp_servers:
  - name: docs-mcp
    mode: stream
    enabled: true
    url: "https://docs-mcp-stage.apps.int.spoke.preprod.us-east-1.aws.paas.redhat.com/mcp"
    timeout: 30.0

  - name: rhds-mcp
    mode: stdio
    enabled: true
    command: npx
    args:
      - "@scarlet-mesh/mcp-rhds"
    timeout: 30.0
